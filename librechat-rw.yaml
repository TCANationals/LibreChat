version: 1.2.4

cache: true

secureImageLinks: true

# original version
# https://raw.githubusercontent.com/fuegovic/lc-config-yaml/main/librechat-rw.yaml

interface:
  termsOfService:
    modalAcceptance: false
    modalTitle: "Terms of Service"
    modalContent: |
      # Terms of Service
      ## Introduction
      Welcome to LibreChat!
  modelSelect: true
  parameters: false
  sidePanel: true
  presets: false
  prompts: true
  bookmarks: false
  multiConvo: true
  agents: false
  customWelcome: "Hey {{user.name}}! Welcome to SkillsGPT"
  runCode: false

mcpServers:
  Time:
    type: stdio
    command: uvx
    args:
      - mcp-server-time
    startup: false
