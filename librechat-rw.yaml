version: 1.2.4

cache: true

secureImageLinks: true

# original version
# https://raw.githubusercontent.com/fuegovic/lc-config-yaml/main/librechat-rw.yaml

interface:
  termsOfService:
    modalAcceptance: false
    modalTitle: "Terms of Service"
    modalContent: |
      # Terms of Service
      ## Introduction
      Welcome to LibreChat!
  modelSelect: true
  parameters: false
  sidePanel: true
  presets: false
  prompts: true
  bookmarks: false
  multiConvo: false # ability to use multiple agents per chat
  agents: false
  customWelcome: "Hey {{user.name}}! Welcome to SkillsGPT"
  runCode: false
  webSearch: true

mcpServers:
  Time:
    type: stdio
    command: uvx
    args:
      - mcp-server-time
    startup: false

webSearch:
  tavilyApiKey: "${TAVILY_API_KEY}"
  searchProvider: "tavily"
  scraperProvider: "tavily"
  rerankerType: "none"
  scraperTimeout: 7500 # Timeout in milliseconds
  safeSearch: 1 # Options: 0 (OFF), 1 (MODERATE - default), 2 (STRICT)
